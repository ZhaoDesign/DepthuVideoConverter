<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DepthuVideoConverter Queue</title>
  <link rel="stylesheet" href="./queue.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">GitHub free queue</p>
        <h1>DepthuVideoConverter</h1>
      </div>
      <a class="button secondary" href="https://github.com/ZhaoDesign/DepthuVideoConverter/actions" target="_blank" rel="noreferrer">Runs</a>
    </header>

    <section class="workspace" aria-label="Create queue job">
      <div class="upload-panel">
        <label class="dropzone" id="dropzone" for="file-input">
          <input id="file-input" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-m4v,video/*">
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M12 3l4.2 4.2-1.4 1.4L13 6.8V16h-2V6.8L9.2 8.6 7.8 7.2 12 3z"></path>
              <path d="M5 14h2v4h10v-4h2v6H5v-6z"></path>
            </svg>
          </span>
          <span class="drop-title">Drop video here</span>
          <span class="drop-copy">MP4, MOV, M4V, WEBM. GitHub issue attachments work best under 10 MB.</span>
        </label>

        <div class="file-card" id="file-card" hidden>
          <div>
            <p class="file-name" id="file-name"></p>
            <p class="file-meta" id="file-meta"></p>
          </div>
          <button class="icon-button" id="clear-file" type="button" aria-label="Clear file">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.4 5L5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6 6.4 5z"></path>
            </svg>
          </button>
        </div>

        <div class="url-row">
          <label for="source-url">Public video URL</label>
          <input id="source-url" type="url" placeholder="https://example.com/video.mp4">
        </div>

        <p class="notice" id="source-notice">Choose a small local file, or use a public HTTPS video URL for larger files.</p>
      </div>

      <aside class="settings-panel" aria-label="Queue settings">
        <div class="field">
          <label for="model">Model</label>
          <select id="model">
            <option>Small (fastest, ~99 MB)</option>
            <option>Base (balanced, ~378 MB)</option>
          </select>
        </div>

        <div class="field">
          <label for="resolution">Resolution</label>
          <select id="resolution">
            <option>Original</option>
            <option>720p</option>
            <option>1080p</option>
          </select>
        </div>

        <div class="field">
          <label for="smoothing">Smoothing <span id="smoothing-value">60</span></label>
          <input id="smoothing" type="range" min="0" max="100" value="60">
        </div>

        <div class="toggle-row">
          <label><input id="preserve-audio" type="checkbox" checked> Preserve audio</label>
          <label><input id="invert" type="checkbox"> Invert depth</label>
        </div>

        <button class="button primary" id="start-job" type="button">Start queue job</button>
        <button class="button secondary" id="copy-block" type="button">Copy queue block</button>
      </aside>
    </section>

    <section class="band">
      <div class="band-head">
        <h2>Current queue</h2>
        <p id="queue-status">Loading from GitHub...</p>
      </div>
      <div id="queue-list" class="queue-list"></div>
    </section>

    <section class="band">
      <div class="band-head">
        <h2>Generated issue body</h2>
        <p id="issue-hint">This opens in GitHub when you start the job.</p>
      </div>
      <pre id="queue-block" class="code-block"></pre>
    </section>
  </main>

  <script>
    window.__QUEUE_REPO__ = "ZhaoDesign/DepthuVideoConverter";
  </script>
  <script src="./queue.js"></script>
</body>
</html>
